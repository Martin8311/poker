<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>找回密码</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-container auth-container-wide">
    <h1>找回密码</h1>
    <h2>通过绑定手机号验证</h2>

    <div id="resetMessage" class="success-message" hidden></div>
    <div id="resetError" class="error-message" hidden></div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="resetUsername">用户名</label>
            <input type="text" id="resetUsername" name="username" maxlength="45" required>
        </div>

        <div class="form-group">
            <label for="resetPhoneNumber">绑定手机号</label>
            <input type="text" id="resetPhoneNumber" name="phoneNumber" maxlength="11" required>
        </div>

        <div class="human-verify-box auth-human-box">
            <div class="human-verify-head">
                <span id="resetHumanPrompt">请先填写用户名后加载人机验证</span>
                <button type="button" class="link-button" id="resetRefreshHumanBtn">换一个</button>
            </div>
            <div id="resetHumanContent"></div>
            <div class="form-group">
                <input type="text" id="resetHumanAnswer" maxlength="8" placeholder="请输入答案">
            </div>
            <button type="button" id="resetVerifyHumanBtn">完成人机验证</button>
        </div>

        <div class="form-group code-row">
            <input type="text" id="resetCode" maxlength="6" placeholder="6 位验证码">
            <button type="button" id="resetSendCodeBtn">发送验证码</button>
        </div>

        <div class="form-group">
            <label for="resetNewPassword">新密码</label>
            <input type="password" id="resetNewPassword" maxlength="64" minlength="6" required>
        </div>

        <div class="form-group">
            <label for="resetConfirmPassword">确认新密码</label>
            <input type="password" id="resetConfirmPassword" maxlength="64" minlength="6" required>
        </div>

        <div class="form-actions">
            <button type="submit" id="resetSubmitBtn">重置密码</button>
        </div>
    </form>

    <p><a th:href="@{/login}">返回登录</a></p>
</div>

<script th:src="@{/js/auth/forgot-password.js}"></script>
</body>
</html>
